name: Verify signing secrets
# Runs only on the verify-secrets branch (never on the release branch) and builds nothing. It checks the six secrets without ever printing a value: only PASS/FAIL, lengths and public fingerprints.
on:
  push:
    branches: [verify-secrets]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OTA_SIGNING_PRIVATE_KEY: ${{ secrets.OTA_SIGNING_PRIVATE_KEY }}
      OTA_SIGNING_KEY_PASSPHRASE: ${{ secrets.OTA_SIGNING_KEY_PASSPHRASE }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Check the six secrets
        run: |
          set +e; umask 077; fails=0; T=$(mktemp -d)
          ok()   { echo "PASS  $1"; }
          bad()  { echo "FAIL  $1 - $2"; fails=$((fails+1)); }
          for n in OTA_SIGNING_PRIVATE_KEY OTA_SIGNING_KEY_PASSPHRASE ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            v="${!n}"; if [ -z "$v" ]; then bad $n "is empty or not set"; else echo "info  $n is set, ${#v} characters"; fi
          done
          # --- Android: same bytes as the committed keystore, same identity as the installed Build 42
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > $T/ks 2>/dev/null
          if cmp -s $T/ks android/debug.keystore; then ok "ANDROID_KEYSTORE_BASE64 decodes to exactly android/debug.keystore"; else bad ANDROID_KEYSTORE_BASE64 "does not decode to the committed keystore (extra space/newline, truncated or wrong content)"; fi
          [ "$ANDROID_KEY_ALIAS" = "androiddebugkey" ] && ok "ANDROID_KEY_ALIAS is androiddebugkey" || bad ANDROID_KEY_ALIAS "is not exactly androiddebugkey (check for spaces or a newline)"
          [ "$ANDROID_KEYSTORE_PASSWORD" = "android" ] && ok "ANDROID_KEYSTORE_PASSWORD is android" || bad ANDROID_KEYSTORE_PASSWORD "is not exactly android"
          [ "$ANDROID_KEY_PASSWORD" = "android" ] && ok "ANDROID_KEY_PASSWORD is android" || bad ANDROID_KEY_PASSWORD "is not exactly android"
          FP=$(keytool -list -v -keystore $T/ks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" 2>/dev/null | grep "SHA256:" | head -1 | sed 's/.*SHA256: //')
          WANT="CE:DD:D6:86:8B:F9:4C:30:B2:70:F3:59:01:88:66:95:EE:6A:E9:AB:95:51:19:6C:2C:A9:E2:99:50:04:1C:39"
          [ "$FP" = "$WANT" ] && ok "keystore opens with the given password and alias; certificate matches installed Build 42 ($FP)" || bad "ANDROID keystore/password/alias" "could not open it or fingerprint differs (got: ${FP:-nothing})"
          # --- OTA: passphrase shape, key opens, and it is the pair of the public key pinned in the app
          printf '%s' "$OTA_SIGNING_KEY_PASSPHRASE" | grep -Eq '^[0-9a-f]{64}$' && ok "OTA_SIGNING_KEY_PASSPHRASE is 64 hex characters, no stray whitespace" || bad OTA_SIGNING_KEY_PASSPHRASE "is not exactly 64 lowercase hex characters"
          printf '%s\n' "$OTA_SIGNING_PRIVATE_KEY" > $T/k.pem
          head -1 $T/k.pem | grep -q '^-----BEGIN ENCRYPTED PRIVATE KEY-----$' && ok "OTA_SIGNING_PRIVATE_KEY starts with the BEGIN ENCRYPTED PRIVATE KEY line" || bad OTA_SIGNING_PRIVATE_KEY "first line is not -----BEGIN ENCRYPTED PRIVATE KEY-----"
          grep -q $'\r' $T/k.pem && bad OTA_SIGNING_PRIVATE_KEY "contains Windows line endings"
          printf '%s' "$OTA_SIGNING_KEY_PASSPHRASE" > $T/pp
          openssl pkey -in $T/k.pem -passin file:$T/pp -pubout -outform DER 2>/dev/null | base64 -w0 > $T/pub.b64
          if [ ! -s $T/pub.b64 ]; then bad OTA_SIGNING_PRIVATE_KEY "cannot be opened with OTA_SIGNING_KEY_PASSPHRASE (wrong pair, truncated or altered)"
          elif [ "$(cat $T/pub.b64)" = "$(tr -d '\n ' < assets/ota/ota_public_key.b64)" ]; then ok "OTA private key opens with the passphrase and is the pair of the public key pinned in the app (SHA-256 $(base64 -d $T/pub.b64 | sha256sum | cut -c1-16)...)"
          else bad OTA_SIGNING_PRIVATE_KEY "opens, but is NOT the pair of assets/ota/ota_public_key.b64"; fi
          rm -rf $T
          echo; [ $fails -eq 0 ] && echo "RESULT: all six secrets are correct" || { echo "RESULT: $fails problem(s) above"; exit 1; }
