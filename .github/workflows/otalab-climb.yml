name: OTA lab - real Climb Up through the new host (experimental, never publishes)
# Runs the actual Climb Up game three ways on one emulator: the unmodified packaged app (built from :android with the committed debug keystore, NOT uploaded), the same classes
# packaged without a loader, and the same classes delivered as a signed module through the new host. Isolated application ids, throw-away signing key, no secrets, no release.
on:
  workflow_dispatch: {}
  push:
    branches: [exp/ota-full]
permissions:
  contents: read

jobs:
  regression:
    name: existing regression suite (core) + module tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :climbmodule:test :hostkit:test --no-daemon

  climb:
    name: climb (emulator Android ${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 34, label: "14 / API 34" }
          - { api: 36, label: "16 / API 36" }
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android SDK licenses (runner image ships the SDK)
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$ANDROID_HOME/licenses/android-sdk-license"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Climb Up module jar (unchanged core + entry class)
        run: ./gradlew :climbmodule:moduleJar :climbmodule:markedModuleJar :hostkit:jar --no-daemon
      - name: Throw-away lab signing keys (inside this run only)
        run: |
          set -e
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$RUNNER_TEMP/lab.pem"
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$RUNNER_TEMP/other.pem"
          openssl pkey -in "$RUNNER_TEMP/lab.pem" -pubout -outform DER | base64 -w0 > "$RUNNER_TEMP/lab_pub.b64"
          mkdir -p climbhost/src/main/assets && cp "$RUNNER_TEMP/lab_pub.b64" climbhost/src/main/assets/lab_public_key.b64
      - run: pip install pillow
      - name: Build the module bundles (dex via D8), gate on duplicate classes, verify with the host's own verifier
        run: |
          set -e
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1); LIB=$(ls -d $ANDROID_HOME/platforms/android-* | grep -E 'android-[0-9]+$' | sort -V | tail -1)/android.jar
          VER=$(grep -oP "appVersionName = '\K[^']+" build.gradle)
          tools/otalab/build_climb_fixtures.sh climbmodule/build/libs/climb-module-$VER.jar "$RUNNER_TEMP/serve" climbhost/src/main/assets/baseline "$RUNNER_TEMP/lab.pem" "$RUNNER_TEMP/other.pem" "$BT/d8" "$LIB" climbmodule/build/libs/climb-module-marked-$VER.jar
          "$BT/dexdump" -f climbhost/src/main/assets/baseline/module.dex | grep "Class descriptor" > "$RUNNER_TEMP/classes.txt"
          echo "module classes: $(wc -l < "$RUNNER_TEMP/classes.txt")"; ls -l climbhost/src/main/assets/baseline/
          if grep -E "Lcom/badlogic/|Lcom/hotatticgames/climbup/spi/" "$RUNNER_TEMP/classes.txt"; then echo "::error::module dex carries host-owned classes"; exit 1; fi
          "$BT/dexdump" -f "$RUNNER_TEMP/serve/c7_code_change/module.dex" | grep "Class descriptor" > "$RUNNER_TEMP/classes7.txt"
          if grep -E "Lcom/badlogic/|Lcom/hotatticgames/climbup/spi/" "$RUNNER_TEMP/classes7.txt"; then echo "::error::code-update module dex carries host-owned classes"; exit 1; fi
          grep -q "ClimbModuleMarked" "$RUNNER_TEMP/classes7.txt" && echo "code-update release: $(wc -l < "$RUNNER_TEMP/classes7.txt") classes (baseline has $(wc -l < "$RUNNER_TEMP/classes.txt"))"
          CP="hostkit/build/libs/hostkit-$VER.jar:modspi/build/libs/modspi-$VER.jar:$(find ~/.gradle -name 'gdx-1.14.2.jar' | head -1)"
          java -cp "$CP" com.hotatticgames.climbup.host.VerifyBundleCli climbhost/src/main/assets/baseline "$RUNNER_TEMP/lab_pub.b64" com.hotatticgames.climbup.otaexp internal
          for ok in c2_same_world c3_new_generator c5_no_entry c7_code_change c8_after_interrupt; do java -cp "$CP" com.hotatticgames.climbup.host.VerifyBundleCli "$RUNNER_TEMP/serve/$ok" "$RUNNER_TEMP/lab_pub.b64" com.hotatticgames.climbup.otaexp internal; done
          if java -cp "$CP" com.hotatticgames.climbup.host.VerifyBundleCli "$RUNNER_TEMP/serve/c4_tampered" "$RUNNER_TEMP/lab_pub.b64" com.hotatticgames.climbup.otaexp internal; then echo "::error::host verifier ACCEPTED the tampered module"; exit 1; fi
      - name: Deterministic digests on the JVM (broad seed set; the emulator compares the device with these)
        run: |
          VER=$(grep -oP "appVersionName = '\K[^']+" build.gradle)
          tools/otalab/jvm_digests.sh climbmodule/build/libs/climb-module-$VER.jar "$(find ~/.gradle -name 'gdx-1.14.2.jar' | head -1)" assets/data/tuning.json "$RUNNER_TEMP/jvm-digests.txt" 3
      - uses: actions/upload-artifact@v4
        with:
          name: "jvm-digests-api${{ matrix.api }}"
          path: "${{ runner.temp }}/jvm-digests.txt"
      - name: Embed the signed test releases and the reference digests in the host APK (the lab console runs the scenarios from inside the phone)
        run: |
          mkdir -p climbhost/src/main/assets/updates
          for p in c2_same_world c3_new_generator c4_tampered c5_no_entry c7_code_change c8_after_interrupt; do cp -r "$RUNNER_TEMP/serve/$p" climbhost/src/main/assets/updates/; done
          cp "$RUNNER_TEMP/jvm-digests.txt" climbhost/src/main/assets/reference-digests.txt
          du -sh climbhost/src/main/assets/updates; ls climbhost/src/main/assets/updates/c7_code_change
      - name: Assemble the three apps (module host, packaged reference, unmodified packaged game)
        run: ./gradlew :climbhost:assembleDebug :climbref:assembleDebug :android:assembleDebug --no-daemon -PwithAndroid
      - name: Inventory (sizes, native libs, dex counts, permissions)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          for a in climbhost climbref android; do f=$(ls $a/build/outputs/apk/debug/*.apk | head -1); echo "== $a: $f"; ls -l "$f" | awk '{print $5" bytes"}'; sha256sum "$f" | cut -c1-64; unzip -l "$f" | grep -E "\.so$|classes[0-9]*\.dex" ; "$BT/aapt2" dump badging "$f" | grep -E "^package|targetSdk|uses-permission"; done
          cp climbhost/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/host.apk"; cp climbref/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/ref.apk"; cp android/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/base.apk"
      - name: Play-compatible packaging gate (store edition has no loader code; same game classes as the module)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          tools/otalab/store_gate.sh "$RUNNER_TEMP/base.apk" "$RUNNER_TEMP/host.apk" "$RUNNER_TEMP/classes.txt" "$BT"
      - uses: actions/upload-artifact@v4
        with:
          name: "climb-exp-apks-api${{ matrix.api }}"
          path: |
            ${{ runner.temp }}/host.apk
            ${{ runner.temp }}/ref.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
      - run: pip install pillow
      - name: Emulator run (Android ${{ matrix.label }}, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          script: env JVM_DIGESTS="${{ runner.temp }}/jvm-digests.txt" BASE_APK="${{ runner.temp }}/base.apk" REF_APK="${{ runner.temp }}/ref.apk" HOST_APK="${{ runner.temp }}/host.apk" SERVE="${{ runner.temp }}/serve" OUT="${{ runner.temp }}/climb-out" tools/otalab/climb_emulator_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "climb-emulator-evidence-api${{ matrix.api }}"
          path: "${{ runner.temp }}/climb-out"
