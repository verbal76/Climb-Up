    args = [project.findProperty('settingsShotsData') ?: "${buildDir}/settingsshots/data".toString(), project.findProperty('settingsShotsShots') ?: "${buildDir}/settingsshots/shots".toString()]
    systemProperties System.properties.findAll { it.key.toString().startsWith('scenario.') || it.key.toString().startsWith('climb.') }
}

