name: Compare difficulty runs
# Prints a compact baseline-vs-new comparison of two finished "Difficulty report" runs into the job log (their consolidated artifacts are
# downloaded here on GitHub). Edit BASE_RUN / NEW_RUN and push this file (or tools/ci/compare_runs.py) to compare another pair. Publishes nothing.
on:
  workflow_dispatch:
  push:
    branches: [build-74-determinism]
    paths:
      - '.github/workflows/compare-runs.yml'
      - 'tools/ci/compare_runs.py'
permissions:
  contents: read
  actions: read
env:
  BASE_RUN: '40303676032'
  NEW_RUN: '40322260139'
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: difficulty-baseline-3lane
          run-id: ${{ env.BASE_RUN }}
          github-token: ${{ github.token }}
          path: base
      - uses: actions/download-artifact@v4
        with:
          name: difficulty-baseline-3lane
          run-id: ${{ env.NEW_RUN }}
          github-token: ${{ github.token }}
          path: new
      - name: Compare
        run: python3 tools/ci/compare_runs.py base new
