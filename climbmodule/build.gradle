plugins { id 'java-library' }
evaluationDependsOn(':core')
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }

// The Climb Up game module = the unchanged :core classes + a thin entry class. libGDX and the host SPI belong to the HOST and are deliberately not packaged.
dependencies {
    compileOnly project(':modspi')
    compileOnly project(':core')
    compileOnly "com.badlogicgames.gdx:gdx:$gdxVersion"
    testImplementation 'junit:junit:4.13.2'
    testImplementation project(':modspi')
    testImplementation project(':core')
    testImplementation "com.badlogicgames.gdx:gdx:$gdxVersion"
}

// Test release whose entry class differs from the shipped module's (it runs extra code and reports it). Everything else in it is identical, :core included.
sourceSets { marked { java.srcDir 'src/marked/java'; compileClasspath += sourceSets.main.output + configurations.compileClasspath } }
configurations { markedCompileOnly.extendsFrom compileOnly }

tasks.register('moduleJar', Jar) {
    archiveBaseName = 'climb-module'
    dependsOn ':core:classes', 'classes'
    from sourceSets.main.output
    from project(':core').sourceSets.main.output
    // reproducible: no timestamps, stable order
    preserveFileTimestamps = false; reproducibleFileOrder = true
}

tasks.register('markedModuleJar', Jar) {
    archiveBaseName = 'climb-module-marked'
    dependsOn ':core:classes', 'classes', 'markedClasses'
    from sourceSets.main.output
    from project(':core').sourceSets.main.output
    from sourceSets.marked.output
    preserveFileTimestamps = false; reproducibleFileOrder = true
}

test {
    dependsOn 'moduleJar', 'markedModuleJar'
    systemProperty 'climb.markedJar', tasks.named('markedModuleJar').get().archiveFile.get().asFile.absolutePath
    systemProperty 'climb.moduleJar', tasks.named('moduleJar').get().archiveFile.get().asFile.absolutePath
    systemProperty 'climb.coreClasses', project(':core').sourceSets.main.output.classesDirs.asPath
    testLogging { events 'passed', 'failed', 'skipped'; exceptionFormat 'full'; showStandardStreams = true }
    maxHeapSize = '1g'
}
