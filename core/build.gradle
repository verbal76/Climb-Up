plugins { id 'java-library' }
tasks.withType(JavaCompile).configureEach { options.release = 17 }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    testImplementation 'junit:junit:4.13.2'
}
test { testLogging { events 'passed', 'failed', 'skipped'; exceptionFormat 'full'; showStandardStreams = true }; maxHeapSize = '1g' }

// Release gate: run the freshly built OTA files through the app's own client against the pinned key (see OtaVerifyCli).
tasks.register('verifyOta', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.hotatticgames.climbup.ota.OtaVerifyCli'
    workingDir = rootProject.projectDir
    args = [project.findProperty('otaDir') ?: 'build/ota'] + (project.hasProperty('expectBundled') ? ['--expect-bundled'] : [])
}

// Dev probes in the test sources (e.g. ./gradlew :core:probe -Pmain=com.hotatticgames.climbup.RopeClearProbe -Pargs="22222-243N-ZJHT 30")
tasks.register('probe', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = project.findProperty('main') ?: 'com.hotatticgames.climbup.GenPrint'
    workingDir = projectDir
    args = (project.findProperty('args') ?: '').toString().tokenize(' ')
    if (project.hasProperty('dbg')) systemProperty 'dbg', 'true'
}
// Dev: the test runtime classpath, for running several probes side by side without Gradle (./gradlew -q :core:probeClasspath)
tasks.register('probeClasspath') { doLast { println sourceSets.test.runtimeClasspath.asPath } }

// Demo layer (docs/DEMO.md): the edition is fixed when the game is BUILT, never by a run-time switch. -Pclimb.edition=demo builds the demo;
// anything else (the default) builds the full game exactly as before. The generated class also carries the demo's traceability stamps.
def edition = (project.findProperty('climb.edition') ?: 'full').toString()
if (!(edition in ['full', 'demo'])) throw new GradleException("climb.edition must be 'full' or 'demo', not '${edition}'")
def editionDir = layout.buildDirectory.dir('generated/edition')
def editionStamp = [
    demo: edition == 'demo',
    revision: (project.findProperty('climb.demoRevision') ?: '0').toString(),
    sourceCommit: (project.findProperty('climb.sourceCommit') ?: System.getenv('GITHUB_SHA') ?: 'unknown').toString(),
    buildNumber: (System.getenv('BUILD_NUMBER') ?: project.findProperty('buildNumber') ?: project.findProperty('buildCode') ?: '0').toString()
]
def generateEdition = tasks.register('generateEdition') {
    inputs.property('stamp', editionStamp.toString())
    outputs.dir(editionDir)
    doLast {
        def f = editionDir.get().file('com/hotatticgames/climbup/EditionInfo.java').asFile
        f.parentFile.mkdirs()
        def q = { String s -> s.replace('\\', '\\\\').replace('"', '\\"') }
        f.text = """package com.hotatticgames.climbup;

/** Generated by core/build.gradle (generateEdition): fixed at build time. Do not edit. */
final class EditionInfo {
    private EditionInfo() { }
    static final boolean DEMO = ${editionStamp.demo};
    static final String DEMO_REVISION = "${q(editionStamp.revision)}";
    static final String SOURCE_COMMIT = "${q(editionStamp.sourceCommit)}";
    static final String BUILD_NUMBER = "${q(editionStamp.buildNumber)}";
}
"""
    }
}
sourceSets.main.java.srcDir(editionDir)
tasks.named('compileJava') { dependsOn generateEdition }
