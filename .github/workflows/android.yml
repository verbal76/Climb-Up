name: Android build
# Not run on every push (deliberate: hosted CI minutes are only spent when the owner asks for a test APK).
on:
  workflow_dispatch: {}
  push:
    branches: [ccr-cb458cd1-w4dh5c]
permissions:
  contents: write   # publish GitHub Releases
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android SDK licenses (runner image ships the SDK)
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (headless simulation, generator, persistence)
        run: ./gradlew :core:test --no-daemon
      - name: Assemble debug APK
        run: ./gradlew :android:assembleDebug --no-daemon -PwithAndroid
      - name: Name, verify and fingerprint the APK
        run: |
          set -e
          SRC=$(ls android/build/outputs/apk/debug/*.apk | head -1)
          OUT=android/build/outputs/apk/debug/climb-up-0.1.0-build${{ github.run_number }}-debug.apk
          cp "$SRC" "$OUT"; rm -f "$SRC"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "SOURCE_SHA=${{ github.sha }}"
          echo "APK=$(basename $OUT)"
          sha256sum "$OUT"
          "$BT/aapt2" dump badging "$OUT" | grep -E "^package|sdkVersion|targetSdkVersion|uses-permission|launchable-activity|native-code"
          "$BT/apksigner" verify --verbose "$OUT" | head -5
          unzip -l "$OUT" | grep -E "\.so$|classes.*dex|assets/courses" | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: climb-up-debug-apk-${{ github.run_number }}
          path: android/build/outputs/apk/debug/*.apk
      - name: Release diagnostics (temporary)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -i -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/releases -d '{"tag_name":"v0.0.0-diag","target_commitish":"${{ github.sha }}","name":"diag","draft":true}' | head -40
          echo ---; curl -sS -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/${{ github.repository }}/actions/permissions/workflow
          echo ---; curl -sS -i -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/${{ github.repository }}/releases | head -20
      - name: One-time - publish the already-built build 4 APK as its own release
        continue-on-error: true
        if: github.run_number == 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh run download 37736651485 -n climb-up-debug-apk-4 -D prev
          APK=$(ls prev/*.apk)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          test "$SHA" = "b022f18a0fbf3c9b474c0cef733c7bd9f98aecc77825fe2ee16b4cc6aeb20638"
          printf 'Physical-test build 4 (debug-signed, sideload).\n\nSource: de5521f3aebe89c1ee74ec0ae3062284df54aa1b\nPackage: com.hotatticgames.climbup, versionName 0.1.0, versionCode 4, minSdk 26, targetSdk 35\nSHA-256: %s\n' "$SHA" > notes4.md
          gh release create v0.1.0-build4 "$APK" --target de5521f3aebe89c1ee74ec0ae3062284df54aa1b --title "Climb up v0.1.0 (build 4)" --notes-file notes4.md --latest=false
      - name: Publish GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(ls android/build/outputs/apk/debug/*.apk)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          printf 'Physical-test build ${{ github.run_number }} (debug-signed, sideload).\n\nSource: ${{ github.sha }}\nPackage: com.hotatticgames.climbup, versionName 0.1.0, versionCode ${{ github.run_number }}\nSHA-256: %s\n' "$SHA" > notes.md
          gh release create "v0.1.0-build${{ github.run_number }}" "$APK" --target ${{ github.sha }} --title "Climb up v0.1.0 (build ${{ github.run_number }})" --notes-file notes.md --latest
