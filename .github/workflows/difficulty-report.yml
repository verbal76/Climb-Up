name: Difficulty report
# DIAGNOSTIC ONLY (owner directive 2026-10-25, Priority 1): generates ten castles of seeded NORMAL, PUNISHER and NEVER GONNA HAPPEN climbs the way the
# game streams them, runs the existing slice solver on each slice, and scores every 25 m window with core/src/test/java/.../sim/DifficultyScore
# (never used by the generator). Publishes nothing; one job per mode and seed, each uploading its partial results even if it fails or runs out of
# time; a final job merges them into difficulty_report.pdf plus CSV and JSON.
on:
  workflow_dispatch:
  push:
    branches: [build-74-determinism]
    paths:
      - '.github/workflows/difficulty-report.yml'
      - 'core/src/test/java/com/hotatticgames/climbup/sim/DifficultyScore.java'
      - 'core/src/test/java/com/hotatticgames/climbup/sim/DifficultyReport.java'
      - 'tools/ci/difficulty_pdf.py'
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        mode: ['0', '1', '2']
        seed: ['1', '2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Scoring unit test
        run: ./gradlew :core:test --tests 'com.hotatticgames.climbup.sim.DifficultyScoreTest' --no-daemon -q
      - name: Generate, solve and score ten castles
        timeout-minutes: 270
        env:
          RUN_BUDGET: '15000'
        run: |
          set -e
          GDX=$(find ~/.gradle -name 'gdx-1.14.2.jar' | head -1)
          cd core && java -Xmx3g -cp "build/classes/java/main:build/classes/java/test:$GDX" com.hotatticgames.climbup.sim.DifficultyReport ../assets/data/tuning.json 5000 ${{ matrix.mode }} ${{ matrix.seed }} ../report
      - name: Summary
        if: always()
        run: cat report/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: difficulty-report-mode-${{ matrix.mode }}-seed-${{ matrix.seed }}
          path: report/
  consolidate:
    needs: report
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: difficulty-report-mode-*
          path: parts
      - name: Merge into PDF, CSV and JSON
        run: |
          pip install --quiet matplotlib
          python3 tools/ci/difficulty_pdf.py parts consolidated
          cp parts/*/summary.md consolidated/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: difficulty-report-consolidated
          path: consolidated/
