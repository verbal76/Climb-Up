name: Android build
# Not run on every push (deliberate: hosted CI minutes are only spent when the owner asks for a test APK).
on:
  workflow_dispatch: {}
  push:
    branches: [ccr-cb458cd1-w4dh5c]
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (headless simulation, generator, persistence)
        run: ./gradlew :core:test --no-daemon
      - name: Assemble debug APK
        run: ./gradlew :android:assembleDebug --no-daemon -PwithAndroid
      - name: Name, verify and fingerprint the APK
        run: |
          set -e
          SRC=$(ls android/build/outputs/apk/debug/*.apk | head -1)
          OUT=android/build/outputs/apk/debug/climb-up-0.1.0-build${{ github.run_number }}-debug.apk
          cp "$SRC" "$OUT"; rm -f "$SRC"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "SOURCE_SHA=${{ github.sha }}"
          echo "APK=$(basename $OUT)"
          sha256sum "$OUT"
          "$BT/aapt2" dump badging "$OUT" | grep -E "^package|sdkVersion|targetSdkVersion|uses-permission|launchable-activity|native-code"
          "$BT/apksigner" verify --verbose "$OUT" | head -5
          unzip -l "$OUT" | grep -E "\.so$|classes.*dex|assets/courses" | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: climb-up-debug-apk-${{ github.run_number }}
          path: android/build/outputs/apk/debug/*.apk
