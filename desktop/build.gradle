// Run once as is (master switch off) and once with -Dclimb.atmos=true. Locally: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :desktop:atmosShot
tasks.register('atmosShot', JavaExec) {
    group = 'verification'
