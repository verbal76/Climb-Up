name: OTA lab - signed game-file delivery (experimental, never publishes)
# Owner: OTA Engineer 2 (docs/ota-full/OWNERSHIP.md). Delivers a changed GAME FILE for the real game through the module host on an emulator: download into the content store,
# verification, activation at the next cold start, the game drawing the delivered file, every other file still coming from the APK. Isolated application id, throw-away signing key, no
# secrets, no release.
on:
  workflow_dispatch: {}
  push:
    branches: [exp/ota-full, exp/ota-reliability]
permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android SDK licenses (runner image ships the SDK)
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$ANDROID_HOME/licenses/android-sdk-license"
      - uses: gradle/actions/setup-gradle@v4
      - name: Host unit tests (asset manifest, store, overlay, delivery)
        run: ./gradlew :hostkit:test :climbmodule:moduleJar --no-daemon
      - name: Throw-away lab signing keys (inside this run only)
        run: |
          set -e
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$RUNNER_TEMP/lab.pem"
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$RUNNER_TEMP/other.pem"
          openssl pkey -in "$RUNNER_TEMP/lab.pem" -pubout -outform DER | base64 -w0 > "$RUNNER_TEMP/lab_pub.b64"
          mkdir -p climbhost/src/main/assets && cp "$RUNNER_TEMP/lab_pub.b64" climbhost/src/main/assets/lab_public_key.b64
      - run: pip install pillow
      - name: Build the baseline module (inside the APK) and the release that serves a changed game file; verify both with the host's own verifier
        run: |
          set -e
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1); LIB=$(ls -d $ANDROID_HOME/platforms/android-* | grep -E 'android-[0-9]+$' | sort -V | tail -1)/android.jar
          VER=$(grep -oP "appVersionName = '\K[^']+" build.gradle); JAR=climbmodule/build/libs/climb-module-$VER.jar
          tools/otalab/build_climb_fixtures.sh "$JAR" "$RUNNER_TEMP/serve" climbhost/src/main/assets/baseline "$RUNNER_TEMP/lab.pem" "$RUNNER_TEMP/other.pem" "$BT/d8" "$LIB"
          tools/otalab/build_asset_fixtures.sh "$JAR" "$RUNNER_TEMP/serve" "$RUNNER_TEMP/lab.pem" "$BT/d8" "$LIB"
          ./gradlew :hostkit:jar --no-daemon -q
          CP="hostkit/build/libs/hostkit-$VER.jar:modspi/build/libs/modspi-$VER.jar:$(find ~/.gradle -name 'gdx-1.14.2.jar' | head -1)"
          for d in climbhost/src/main/assets/baseline "$RUNNER_TEMP/serve/c6_assets"; do java -cp "$CP" com.hotatticgames.climbup.host.VerifyBundleCli "$d" "$RUNNER_TEMP/lab_pub.b64" com.hotatticgames.climbup.otaexp internal; done
          ls -l "$RUNNER_TEMP/serve/c6_assets" "$RUNNER_TEMP/serve/c6_assets/assets"
      - name: Assemble the module host
        run: ./gradlew :climbhost:assembleDebug --no-daemon -PwithAndroid
      - run: cp climbhost/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/host.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
      - name: Emulator run (Android 14 / API 34, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          script: env HOST_APK="${{ runner.temp }}/host.apk" SERVE="${{ runner.temp }}/serve" OUT="${{ runner.temp }}/asset-out" tools/otalab/asset_emulator_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: asset-emulator-evidence, path: "${{ runner.temp }}/asset-out" }
