name: Android build
# MANUAL ONLY (studio standard §9: a push must never auto-publish a release). The owner explicitly triggers this to
# build + publish a numbered APK. Pushes run only the lightweight ci.yml validation, which publishes nothing.
on:
  workflow_dispatch:
    inputs:
      test_build:
        description: "Owner test build: attach the APK to a DRAFT GitHub Release (visible to collaborators only, no tag, nothing public) and skip the OTA baseline publish. Off = the normal published release."
        type: boolean
        default: false
      build_number:
        description: "Build number for the versionCode, APK name, tag and release title (blank = this run's number). Set it so a re-run after a failure, or the desktop build dispatched alongside, still carries the number the owner expects."
        type: string
        default: ""
permissions:
  contents: write   # publish GitHub Releases
  actions: read

env:
  BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
  # The signing certificate of the installed Build 42 (builds 37-42). The build fails if the APK it produces is signed by anything else, so an update can never be un-installable.
  EXPECTED_CERT_SHA256: "CE:DD:D6:86:8B:F9:4C:30:B2:70:F3:59:01:88:66:95:EE:6A:E9:AB:95:51:19:6C:2C:A9:E2:99:50:04:1C:39"

jobs:
  build:
    # branch guard: a dispatch from any other branch can never publish. Build 74 (owner, 2026-10-22): its own branch publishes too, and every build
    # is a full (published) release so it shows in the owner's GitHub app.
    if: github.ref == 'refs/heads/ccr-cb458cd1-w4dh5c' || github.ref == 'refs/heads/build-74-determinism'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Prove the signing secrets are the right ones (prints PASS/FAIL only, never a value)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          OTA_SIGNING_PRIVATE_KEY: ${{ secrets.OTA_SIGNING_PRIVATE_KEY }}
          OTA_SIGNING_KEY_PASSPHRASE: ${{ secrets.OTA_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -e
          tools/ci/verify_secrets.sh --keystore-out "$RUNNER_TEMP/android-signing.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/android-signing.keystore" >> "$GITHUB_ENV"
      - name: Accept Android SDK licenses (runner image ships the SDK)
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (headless simulation, generator, persistence, OTA incl. end-to-end over local HTTP)
        run: ./gradlew :core:test --no-daemon
      - name: Assemble the release APK (not debuggable; signed with the Build 42 identity)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :android:assembleRelease --no-daemon -PwithAndroid
      - name: Name, sign with key rotation, verify and fingerprint the APK
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -e
          SRC=$(ls android/build/outputs/apk/release/*.apk | head -1)
          VER=$(grep -oP "appVersionName = '\K[^']+" build.gradle)
          OUT=android/build/outputs/apk/release/upwardly-${VER}-build${{ env.BUILD_NUMBER }}.apk
          tools/ci/rotate_sign.sh "$SRC" "$OUT"; rm -f "$SRC"     # Build 73: private key for Android 9+, proof of rotation from the old identity
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "SOURCE_SHA=${{ github.sha }}"
          echo "APK=$(basename $OUT)"
          sha256sum "$OUT"
          "$BT/aapt2" dump badging "$OUT" > badging.txt; grep -E "^package|sdkVersion|targetSdkVersion|uses-permission|launchable-activity|native-code" badging.txt
          if grep -q "application-debuggable" badging.txt; then echo "::error::the released APK must not be debuggable"; exit 1; fi
          echo "not debuggable"
          "$BT/apksigner" verify --verbose --print-certs "$OUT" > cert.txt; head -8 cert.txt
          GOT=$(grep -m1 "certificate SHA-256 digest" cert.txt | sed 's/.*: //' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "SIGNING_CERT_SHA256=$GOT"
          if [ "$GOT" != "$EXPECTED_CERT_SHA256" ]; then echo "::error::APK is not signed with the installed Build 42 identity for Android 8.x (expected $EXPECTED_CERT_SHA256)"; exit 1; fi
          echo "Android 8.x signer matches installed Build 42; Android 9+ signer $ROTATED_SIGNER_SHA256 (rotated from it)"
          unzip -l "$OUT" | grep -E "\.so$|classes.*dex|assets/pack|assets/ota" | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: upwardly-apk-${{ env.BUILD_NUMBER }}
          path: android/build/outputs/apk/release/*.apk
      - name: Fetch the last published APK (Build 71) for the update test
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.1.5-build71 -p '*.apk' -O previous.apk && ls -l previous.apk
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: On an emulator, update Build 71 in place to this APK (same app, data kept) and launch it
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/ci/update_test.sh previous.apk "$(ls android/build/outputs/apk/release/*.apk)"
      - name: Build, sign and verify the OTA baseline (the content bundled in this APK)
        env:
          OTA_SIGNING_PRIVATE_KEY: ${{ secrets.OTA_SIGNING_PRIVATE_KEY }}
          OTA_SIGNING_KEY_PASSPHRASE: ${{ secrets.OTA_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -e
          BASE=$(grep -oP "BUNDLED_CONTENT_VERSION = \K[0-9]+" core/src/main/java/com/hotatticgames/climbup/ota/OtaConfig.java)
          python3 tools/ota/make_ota.py --version "$BASE" --sign
          ./gradlew :core:verifyOta -PotaDir=build/ota -PexpectBundled --no-daemon -q
      - name: Publish GitHub Release (APK)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(ls android/build/outputs/apk/release/*.apk)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          VER=$(grep -oP "appVersionName = '\K[^']+" build.gradle)
          RT=$(grep -oP "RUNTIME = \K[0-9]+" core/src/main/java/com/hotatticgames/climbup/ota/OtaConfig.java)
          BV=$(grep -oP "BUNDLED_CONTENT_VERSION = \K[0-9]+" core/src/main/java/com/hotatticgames/climbup/ota/OtaConfig.java)
          if [ "${{ inputs.test_build }}" = "true" ]; then KIND='Physical-test build'; else KIND='Production release, build'; fi
          printf "$KIND"' ${{ env.BUILD_NUMBER }} (sideload; signed with the same certificate as every build since 37, so it installs over the previous one).\n\nVersion: %s build ${{ env.BUILD_NUMBER }}\nSource: ${{ github.sha }}\nPackage: com.hotatticgames.climbup, versionName %s, versionCode ${{ env.BUILD_NUMBER }}\nSHA-256: %s\nSigning certificate SHA-256: %s\nOTA: signed manifests, runtime %s, bundled content version %s\n' "$VER" "$VER" "$SHA" "$EXPECTED_CERT_SHA256" "$RT" "$BV" > notes.md
          if [ "${{ inputs.test_build }}" = "true" ]; then
            # owner test build: a DRAFT release (collaborators only, creates no tag, never public) carries the APK
            gh release create "v${VER}-build${{ env.BUILD_NUMBER }}" "$APK" --target ${{ github.sha }} --title "Upwardly v${VER} (build ${{ env.BUILD_NUMBER }}) — Android APK (owner test build, draft)" --notes-file notes.md --draft
          else
            # release name as the owner specified for the published test releases: "Upwardly build NN apk"
            gh release create "v${VER}-build${{ env.BUILD_NUMBER }}" "$APK" --target ${{ github.sha }} --title "Upwardly build ${{ env.BUILD_NUMBER }} apk" --notes-file notes.md --latest
          fi
      - name: Publish the OTA baseline (only if the channel does not already carry this version or a newer one)
        if: ${{ inputs.test_build != true }}   # an owner test build never touches the OTA channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          BV=$(grep -oP "BUNDLED_CONTENT_VERSION = \K[0-9]+" core/src/main/java/com/hotatticgames/climbup/ota/OtaConfig.java)
          CUR=0
          if gh release view ota >/dev/null 2>&1; then CUR=$(gh release download ota -p manifest.json -O - 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('contentVersion',0))" 2>/dev/null || echo 0); else
            gh release create ota --latest=false --title "OTA content channel (signed)" --notes "Signed over-the-air content for Upwardly. Files: manifest.json, manifest.sig, payload.zip. Verified by the key pinned in the app; do not edit."; fi
          if [ "$CUR" -ge "$BV" ]; then echo "channel already at v$CUR (>= baseline v$BV): left untouched"; exit 0; fi
          gh release upload ota build/ota/payload.zip build/ota/manifest.json build/ota/manifest.sig --clobber
          echo "published OTA baseline v$BV"
