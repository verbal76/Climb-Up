pluginManagement {
    repositories { gradlePluginPortal(); google(); mavenCentral() }
}
dependencyResolutionManagement {
    repositories { mavenCentral(); google() }
}
rootProject.name = 'climb-up'
include ':core', ':desktop', ':modspi', ':hostkit', ':modsynthetic'
// The Android module needs the Android SDK + Google's Maven; CI (and any machine with ANDROID_HOME) enables it.
if (System.getenv('ANDROID_HOME') != null || System.getenv('ANDROID_SDK_ROOT') != null || hasProperty('withAndroid')) {
    include ':android', ':otalab'
}
