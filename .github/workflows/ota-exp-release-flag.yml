name: UPWARDLY release - make the UPWARDLY APK a normal release named Upwardly.apk
# Only edits the existing release tagged ota-lab-latest: re-uploads its APK as Upwardly.apk (no rebuild), removes the old asset name and clears the pre-release flag. No other release, tag or branch is touched.
on:
  push:
    branches: [exp/ota-release-flag]
    paths: ['tools/otalab/release_flag.txt']
permissions:
  contents: write
jobs:
  flag:
    if: github.ref == 'refs/heads/exp/ota-release-flag'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/rel"
          if gh release view ota-lab-latest --repo "$REPO" --json assets -q '.assets[].name' | grep -qx UPWARDLY.apk; then
            gh release download ota-lab-latest --repo "$REPO" -p UPWARDLY.apk -D "$RUNNER_TEMP/rel"
            mv "$RUNNER_TEMP/rel/UPWARDLY.apk" "$RUNNER_TEMP/rel/Upwardly.apk"
            gh release delete-asset ota-lab-latest UPWARDLY.apk --repo "$REPO" -y      # asset names are case-insensitive: the old one has to go first
            gh release upload ota-lab-latest "$RUNNER_TEMP/rel/Upwardly.apk" --repo "$REPO"
          fi
          SUM=$(gh release view ota-lab-latest --repo "$REPO" --json body -q .body | grep -o 'APK sha256 [0-9a-f]*' | cut -d' ' -f3)
          NOTES="Upwardly for Android: the current production release. It installs as its own app (application id com.hotatticgames.climbup.otaexp, so settings and saves from older builds do not carry over) and updates itself from the GitHub channel when you open it. APK sha256 ${SUM}."
          gh release edit ota-lab-latest --repo "$REPO" --prerelease=false --title "Upwardly for Android" --notes "$NOTES"
          gh release view ota-lab-latest --repo "$REPO" --json name,isPrerelease,assets -q '{name:.name,prerelease:.isPrerelease,assets:[.assets[].name]}'
