plugins { id 'com.android.application' version '8.7.3' }

// Experimental Climb Up host (docs/ota-full). Own application id: it can never replace the installed game.
def buildCode = (System.getenv('GITHUB_RUN_NUMBER') ?: (project.findProperty('buildCode') ?: '1')).toInteger()

android {
    namespace 'com.hotatticgames.climbup.otaref'
    compileSdk 35
    defaultConfig {
        applicationId 'com.hotatticgames.climbup.otaref'
        minSdk 26
        targetSdk 35
        versionCode buildCode
        versionName rootProject.ext.appVersionName + '-otaref'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets {
        main {
            // the game's own assets and Android resources (theme, cutout handling, icons), used in place: nothing is copied or converted
            assets.srcDirs = ['../assets', 'src/main/assets']
            res.srcDirs = ['../android/src/main/res']
            jniLibs.srcDirs = ['libs']
            java.srcDirs += ['../labcommon/java']
        }
    }
    packaging { jniLibs { useLegacyPackaging = false } }
    lint { abortOnError false }
}

configurations { natives }

dependencies {
    implementation project(':modspi')
    implementation "com.badlogicgames.gdx:gdx-backend-android:${rootProject.ext.gdxVersion}"
    natives "com.badlogicgames.gdx:gdx-platform:${rootProject.ext.gdxVersion}:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:${rootProject.ext.gdxVersion}:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:${rootProject.ext.gdxVersion}:natives-x86_64"
    implementation project(':core')
    implementation project(':climbmodule')
}

tasks.register('copyAndroidNatives') {
    doFirst {
        ['armeabi-v7a', 'arm64-v8a', 'x86_64'].each { file("libs/$it").mkdirs() }
        configurations.natives.copy().files.each { jar ->
            def abi = ['armeabi-v7a', 'arm64-v8a', 'x86_64'].find { jar.name.endsWith("natives-${it}.jar") }
            if (abi) copy { from zipTree(jar); into file("libs/$abi"); include '*.so' }
        }
    }
}
tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach { dependsOn 'copyAndroidNatives' }
configurations.configureEach { resolutionStrategy.force 'androidx.core:core:1.15.0' }

