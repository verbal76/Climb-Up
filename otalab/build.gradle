plugins { id 'com.android.application' version '8.7.3' }

// Isolated experimental host for the full-game OTA architecture (docs/ota-full). NOT the shipped game: its own application id, so it can never replace the installed Climb up.
def buildCode = (System.getenv('GITHUB_RUN_NUMBER') ?: (project.findProperty('buildCode') ?: '1')).toInteger()

android {
    namespace 'com.hotatticgames.climbup.otalab'
    compileSdk 35
    defaultConfig {
        applicationId 'com.hotatticgames.climbup.otalab'
        minSdk 26
        targetSdk 35          // Android 14+ read-only dex rule applies (targetSdk >= 34)
        versionCode buildCode
        versionName rootProject.ext.appVersionName + '-otalab'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { jniLibs.srcDirs = ['libs'] } }
    packaging { jniLibs { useLegacyPackaging = false } }
    lint { abortOnError false }
}

configurations { natives }

dependencies {
    implementation project(':hostkit')
    implementation project(':modspi')
    implementation "com.badlogicgames.gdx:gdx-backend-android:${rootProject.ext.gdxVersion}"
    natives "com.badlogicgames.gdx:gdx-platform:${rootProject.ext.gdxVersion}:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:${rootProject.ext.gdxVersion}:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:${rootProject.ext.gdxVersion}:natives-x86_64"
}

tasks.register('copyAndroidNatives') {
    doFirst {
        ['armeabi-v7a', 'arm64-v8a', 'x86_64'].each { file("libs/$it").mkdirs() }
        configurations.natives.copy().files.each { jar ->
            def abi = ['armeabi-v7a', 'arm64-v8a', 'x86_64'].find { jar.name.endsWith("natives-${it}.jar") }
            if (abi) copy { from zipTree(jar); into file("libs/$abi"); include '*.so' }
        }
    }
}
tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach { dependsOn 'copyAndroidNatives' }

// Same pin as the game's android module (androidx.core 1.17 needs AGP 8.9.1+).
configurations.configureEach { resolutionStrategy.force 'androidx.core:core:1.15.0' }

// The lab host refuses to build without the public key it must pin: the build supplies it (CI generates a throw-away pair per run), so there is no default key to forget about.
tasks.register('requireLabKey') {
    doFirst { if (!file('src/main/assets/lab_public_key.b64').isFile()) throw new GradleException('otalab/src/main/assets/lab_public_key.b64 missing: tools/otalab/emulator_test.sh creates it') }
}
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach { dependsOn 'requireLabKey' }
