name: Android signing dry run
# VALIDATION ONLY: uploads nothing, publishes nothing. Proves the release signing path (key rotation + update-in-place test) end to end with a
# THROW-AWAY key generated in the run and discarded with it, so the real release key is used only by android.yml. The APK made here is deleted.
on:
  workflow_dispatch:
  push:
    branches: [ccr-cb458cd1-w4dh5c]
    paths:
      - '.github/workflows/signing-dryrun.yml'
      - 'tools/ci/rotate_sign.sh'
      - 'tools/ci/update_test.sh'
      - 'android/build.gradle'
permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$ANDROID_HOME/licenses/android-sdk-license"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble the release APK (committed old identity, as android.yml does)
        run: BUILD_NUMBER=73 ./gradlew :android:assembleRelease --no-daemon -PwithAndroid
      - name: Sign with key rotation to a throw-away key
        run: |
          set -e
          export ANDROID_RELEASE_KEYSTORE_PASSWORD=$(openssl rand -hex 16) ANDROID_RELEASE_KEY_ALIAS=dryrun
          export ANDROID_RELEASE_KEY_PASSWORD=$ANDROID_RELEASE_KEYSTORE_PASSWORD
          keytool -genkeypair -keystore "$RUNNER_TEMP/dry.jks" -alias dryrun -keyalg RSA -keysize 2048 -validity 2 -dname "CN=dry run" -storepass "$ANDROID_RELEASE_KEYSTORE_PASSWORD" -keypass "$ANDROID_RELEASE_KEY_PASSWORD"
          export ANDROID_RELEASE_KEYSTORE_BASE64=$(base64 -w0 "$RUNNER_TEMP/dry.jks"); rm "$RUNNER_TEMP/dry.jks"
          SRC=$(ls android/build/outputs/apk/release/*.apk | head -1)
          tools/ci/rotate_sign.sh "$SRC" "$RUNNER_TEMP/dryrun.apk"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$RUNNER_TEMP/dryrun.apk" | grep -E "^package|application-debuggable" || true
      - name: Fetch the last published APK (Build 71)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.1.5-build71 -p '*.apk' -O previous.apk && ls -l previous.apk
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Update Build 71 in place on an emulator and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/ci/update_test.sh previous.apk "$RUNNER_TEMP/dryrun.apk"
      - name: Discard the dry-run APK
        if: always()
        run: rm -f "$RUNNER_TEMP/dryrun.apk"
